name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc'
            rust_target: x86_64-pc-windows-msvc
            tauri_config: '{"bundle":{"targets":["nsis"],"resources":["resources/**/*"]}}'
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_target: aarch64-apple-darwin
            tauri_config: '{"bundle":{"targets":["dmg"],"resources":["resources/**/*"]}}'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current --strip header

      - name: Download ImageMagick (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # imagemagick.org/archive keeps only the latest build, so resolve the
          # current 7.x portable Q16 x64 filename from the listing instead of
          # pinning a patch version (which 404s as soon as a new patch ships).
          $base = "https://imagemagick.org/archive/binaries/"
          $html = (Invoke-WebRequest -Uri $base -UseBasicParsing).Content
          $file = [regex]::Match($html, 'ImageMagick-7\.[0-9.]+-[0-9]+-portable-Q16-x64\.7z').Value
          if (-not $file) { throw "No ImageMagick 7.x portable Q16 x64 build found at $base" }
          Write-Host "Downloading $file"
          Invoke-WebRequest -Uri "$base$file" -OutFile magick.7z
          7z e magick.7z magick.exe -o"src-tauri\resources" -y
          Remove-Item magick.7z

      - name: Download ExifTool (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl.exe -L "https://sourceforge.net/projects/exiftool/files/exiftool-13.57_64.zip/download" -o exiftool.zip
          Expand-Archive -Path exiftool.zip -DestinationPath exiftool_tmp
          Copy-Item "exiftool_tmp\exiftool-13.57_64\exiftool(-k).exe" "src-tauri\resources\exiftool.exe"
          Copy-Item "exiftool_tmp\exiftool-13.57_64\exiftool_files" "src-tauri\resources\exiftool_files" -Recurse
          Remove-Item exiftool.zip, exiftool_tmp -Recurse -Force

      - name: Download ExifTool (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -L "https://exiftool.org/Image-ExifTool-13.57.tar.gz" -o exiftool.tar.gz
          tar xf exiftool.tar.gz
          mv Image-ExifTool-13.57/exiftool src-tauri/resources/exiftool
          mv Image-ExifTool-13.57/lib src-tauri/resources/lib
          chmod +x src-tauri/resources/exiftool
          rm -rf exiftool.tar.gz Image-ExifTool-13.57

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_CONFIG: ${{ matrix.tauri_config }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'RustyMirror ${{ github.ref_name }}'
          releaseBody: ${{ steps.changelog.outputs.content }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
