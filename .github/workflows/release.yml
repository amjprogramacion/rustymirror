name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--target x86_64-pc-windows-msvc'
            rust_target: x86_64-pc-windows-msvc
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Generate changelog
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --current --strip header

      - name: Download ImageMagick (Windows, vendored 7.1.2-17)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Pinned to 7.1.2-17 hosted as a release asset on this repo.
          # ImageMagick 7.1.2-24 (current latest on imagemagick.org/archive) has
          # a HEIC decoding regression that produces garbled thumbnails — same
          # libheif version on both builds, but the output is corrupted.
          # Revisit and switch back to "latest" once upstream ships a fix.
          $url = "https://github.com/amjprogramacion/rustymirror/releases/download/vendor-magick-7.1.2-17/magick.exe"
          Invoke-WebRequest -Uri $url -OutFile "src-tauri\resources\magick.exe" -UseBasicParsing

      - name: Download ExifTool (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{Authorization = "Bearer $env:GH_TOKEN"}
          $ver = (Invoke-RestMethod -Headers $headers "https://api.github.com/repos/exiftool/exiftool/tags")[0].name
          Write-Host "Downloading ExifTool $ver"
          curl.exe -fL "https://exiftool.org/exiftool-${ver}_64.zip" -o exiftool.zip
          Expand-Archive -Path exiftool.zip -DestinationPath exiftool_tmp
          Copy-Item "exiftool_tmp\exiftool-${ver}_64\exiftool(-k).exe" "src-tauri\resources\exiftool.exe"
          Copy-Item "exiftool_tmp\exiftool-${ver}_64\exiftool_files" "src-tauri\resources\exiftool_files" -Recurse
          Remove-Item exiftool.zip, exiftool_tmp -Recurse -Force

      - name: Download ExifTool (macOS)
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/exiftool/exiftool/tags" \
            | jq -r '.[0].name')
          echo "Downloading ExifTool $VER"
          curl -fL "https://github.com/exiftool/exiftool/archive/refs/tags/${VER}.tar.gz" -o exiftool.tar.gz
          tar xf exiftool.tar.gz
          mv "exiftool-${VER}/exiftool" src-tauri/resources/exiftool
          mv "exiftool-${VER}/lib" src-tauri/resources/lib
          chmod +x src-tauri/resources/exiftool
          rm -rf exiftool.tar.gz "exiftool-${VER}"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'RustyMirror ${{ github.ref_name }}'
          releaseBody: ${{ steps.changelog.outputs.content }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
